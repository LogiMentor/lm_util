# SPDX-License-Identifier: Apache-2.0

name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  safety:
    name: Safety checks
    runs-on: ubuntu-24.04

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install safety dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Run pre-commit hooks
        run: pre-commit run --all-files

      - name: Check LFSR tap polynomials
        run: python tools/check_lfsr_taps.py

      - name: Generate vendor synthesis dry-run scripts
        run: >
          python tools/synth/run_vendor_synth.py
          --config tools/synth/local.example.toml
          --case delay_srl_32x8_depth32_boundary
          --dry-run
          --include-disabled
          --out vendor_synth_out/ci-dry-run

  vunit:
    name: VUnit regression
    runs-on: ubuntu-24.04
    env:
      VUNIT_SIMULATOR: ghdl

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install GHDL
        uses: ghdl/setup-ghdl@75eff367dadc0cd06454a118db0b458d44fdc3c3 # v1.5.1
        with:
          version: v6.0.0
          backend: llvm

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Show tool versions
        run: |
          python --version
          python -m pip show vunit_hdl | grep -E '^(Name|Version):'
          ghdl --version | tee ghdl_version.txt
          grep -q '^GHDL 6\.0\.0 ' ghdl_version.txt || { echo "::error::GHDL 6.0.0 required"; exit 1; }
          grep -qi 'llvm' ghdl_version.txt || { echo "::error::GHDL LLVM backend required"; exit 1; }

      - name: Run negative elaboration checks
        run: python sim/scripts/check_elab_failures.py

      - name: Run fast VUnit regression
        run: >
          python sim/scripts/run.py
          --level fast
          --clean
          --xunit-xml vunit_xunit.xml
          --output-path vunit_out

      # Only the reports: the rest of vunit_out is mostly GHDL executables
      # (one per test), objects and compiled libraries.
      - name: Upload VUnit artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: vunit-results
          retention-days: 7
          path: |
            vunit_xunit.xml
            vunit_out/test_output/*/output.txt

      - name: Upload VUnit test output on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: vunit-test-output
          retention-days: 7
          path: |
            vunit_out/test_output/
            !vunit_out/test_output/*/ghdl/
            !vunit_out/**/*.exe
            !vunit_out/**/*.o
            !vunit_out/**/*.cf
            !vunit_out/**/*.lst
