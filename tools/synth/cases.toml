[[cases]]
name = "clock_measure_16"
entity = "lm_util_clock_measure"
category = "cdc"
description = "Clock measurement: toggle, ready and reset synchronizers between the two clocks."
tags = ["cdc", "ff-chain", "no-srl"]
generics = { g_ref_clock_freq = 100, g_clock_width = 16 }
ports = [
  "ref_clk_i : in std_logic",
  "rst_n_i : in std_logic",
  "clock_to_measure_i : in std_logic",
  "output_frequency_hz_o : out std_logic_vector(15 downto 0)",
]
clocks = { ref_clk_i = 10.0, clock_to_measure_i = 13.0 }
no_shift_register = true
chains = [
  { label = "tick_tgl", signals = ["s_1s_tick_tgl_d", "s_1s_tick_tgl_d2"], registers = 2 },
  { label = "out_freq_rdy", signals = ["s_out_freq_rdy_d", "s_out_freq_rdy_d2"], registers = 2 },
  { label = "resync", signals = ["s_resync_reg"], registers = 2 },
]
constraints = ["src/lm_util_clock_measure.vhd"]

[[cases]]
name = "clock_mux_2"
entity = "lm_util_clock_mux"
category = "clocking"
description = "Glitch-free style clock mux: per-clock enable synchronizers."
tags = ["cdc", "clocking", "clock-mux", "keep", "tool-sensitive"]
generics = { g_num_clocks = 2 }
ports = [
  "clk_i : in std_logic_vector(1 downto 0)",
  "clk_sel_i : in std_logic_vector(1 downto 0)",
  "clk_o : out std_logic",
]
clocks = { "clk_i[0]" = 10.0, "clk_i[1]" = 12.0 }
no_shift_register = true
chains = [{ label = "ena", signals = ["s_ena_r0", "s_ena_r1"], registers = 4 }]
constraints = ["src/lm_util_clock_mux.vhd"]

[[cases]]
name = "guide_ccd_resync"
entity = "lm_util_ccd_resync"
category = "cdc"
description = "Constraint example of the user guide, loaded on lm_util_ccd_resync."
tags = ["cdc", "constraints"]
generics = { g_meta_levels = 2 }
ports = [
  "clk_i : in std_logic",
  "ccd_din_i : in std_logic",
  "ccd_din_o : out std_logic",
]
clocks = { clk_i = 10.0 }
constraints = ["docs/user_guide.md#lm_util_ccd_resync"]

[[cases]]
name = "ccd_sync_bus_8_clock_groups"
entity = "lm_util_ccd_sync_bus"
category = "cdc"
description = "Header constraints of the data bus with the two clocks declared as asynchronous clock groups (user guide, alternative f)."
tags = ["cdc", "constraints", "clock-groups"]
tools = ["vivado"]
generics = { g_bus_width = 8, g_meta_levels = 2 }
ports = [
  "in_clk_i : in std_logic",
  "in_rst_n_i : in std_logic",
  "in_data_i : in std_logic_vector(7 downto 0)",
  "out_rdy_o : out std_logic",
  "out_clk_i : in std_logic",
  "out_req_i : in std_logic",
  "out_data_o : out std_logic_vector(7 downto 0)",
]
clocks = { in_clk_i = 10.0, out_clk_i = 7.0 }
constraints = ["src/lm_util_ccd_sync_bus.vhd"]
constraint_clock_groups = true
# observed with Vivado 2023.1: the clock groups totally override
# set_max_delay -datapath_only, while set_bus_skew is still reported
expect_failed_checks = { vivado = ["constraints:not_ignored"] }
expect_passed_checks = { vivado = ["constraint:lm_util_ccd_sync_bus:1:objects", "constraint:lm_util_ccd_sync_bus:2:objects", "constraint:lm_util_ccd_sync_bus:2:applied", "constraints:bus_skew_reported"] }

# ---------------------------------------------------------------------------
# Negative cases: each must make the listed checks fail. A negative case
# passes only when every check in expect_failed_checks fails; run with
# --ignore-expected-failures to see them reported as failed.
# ---------------------------------------------------------------------------

[[cases]]
name = "neg_chain_no_attr"
entity = "lm_synth_neg_chain"
category = "negative"
description = "Eight-register chain without synchronizer attributes."
tags = ["negative"]
extra_files = ["tools/synth/negative/lm_synth_neg_chain.vhd"]
generics = { g_meta_levels = 8 }
ports = [
  "clk_i : in std_logic",
  "ccd_din_i : in std_logic",
  "ccd_din_o : out std_logic",
]
clocks = { clk_i = 10.0 }
no_shift_register = true
chains = [{ label = "din_meta", signals = ["s_din_meta"], registers = 8 }]
expect_failed_checks = { vivado = ["chain:din_meta:async_reg", "chain:din_meta:cell_type", "no_shift_register"], quartus = ["chain:din_meta:synchronizer"] }

[[cases]]
name = "neg_chain_renamed"
entity = "lm_synth_neg_renamed"
category = "negative"
description = "Attributed chain whose signal name differs from the checked one."
tags = ["negative"]
extra_files = ["tools/synth/negative/lm_synth_neg_renamed.vhd"]
generics = { g_meta_levels = 2 }
ports = [
  "clk_i : in std_logic",
  "ccd_din_i : in std_logic",
  "ccd_din_o : out std_logic",
]
clocks = { clk_i = 10.0 }
chains = [{ label = "din_meta", signals = ["s_din_meta"], registers = 2 }]
constraints = ["src/lm_util_ccd_resync.vhd"]
expect_failed_checks = { vivado = ["chain:din_meta:count", "constraint:lm_util_ccd_resync:1:objects"], quartus = ["chain:din_meta:count", "constraint:lm_util_ccd_resync:1:objects"] }

[[cases]]
name = "neg_shift_register"
entity = "lm_util_delay"
category = "negative"
description = "32x8 delay line that both tools pack into shift-register resources."
tags = ["negative"]
generics = { g_delay = 32, g_data_w = 8 }
ports = [
  "clk_i : in std_logic",
  "ce_i : in std_logic",
  "din_i : in std_logic_vector(7 downto 0)",
  "dout_o : out std_logic_vector(7 downto 0)",
]
clocks = { clk_i = 10.0 }
no_shift_register = true
expect_failed_checks = { vivado = ["no_shift_register"], quartus = ["no_shift_register"] }

# Report completeness. A check that passes when something is absent must
# not pass on a report that is empty, truncated or not recognized. These
# cases synthesize a real design, then corrupt one report (test_corrupt,
# negative cases only) and pass only if the run fails with expect_error.

[[cases]]
name = "neg_report_map_empty"
entity = "lm_util_delay"
category = "negative"
description = "Shift-register design whose Analysis & Synthesis report is emptied before the checks."
tags = ["negative"]
tools = ["quartus"]
generics = { g_delay = 32, g_data_w = 8 }
ports = [
  "clk_i : in std_logic",
  "ce_i : in std_logic",
  "din_i : in std_logic_vector(7 downto 0)",
  "dout_o : out std_logic_vector(7 downto 0)",
]
clocks = { clk_i = 10.0 }
no_shift_register = true
test_corrupt = { report = "project.map.rpt", mode = "empty" }
expect_error = "LM_ERROR: Analysis & Synthesis report is empty"

[[cases]]
name = "neg_report_map_truncated"
entity = "lm_util_delay"
category = "negative"
description = "Shift-register design whose Analysis & Synthesis report is cut before the register packing panel."
tags = ["negative"]
tools = ["quartus"]
generics = { g_delay = 32, g_data_w = 8 }
ports = [
  "clk_i : in std_logic",
  "ce_i : in std_logic",
  "din_i : in std_logic_vector(7 downto 0)",
  "dout_o : out std_logic_vector(7 downto 0)",
]
clocks = { clk_i = 10.0 }
no_shift_register = true
test_corrupt = { report = "project.map.rpt", mode = "truncate", keep_lines = 200 }
expect_error = "LM_ERROR: Analysis & Synthesis report is truncated"

[[cases]]
name = "neg_report_netlist"
entity = "lm_util_ccd_resync"
category = "negative"
description = "Synchronizer checks run after the synthesized design is closed."
tags = ["negative"]
tools = ["vivado"]
generics = { g_meta_levels = 2 }
ports = [
  "clk_i : in std_logic",
  "ccd_din_i : in std_logic",
  "ccd_din_o : out std_logic",
]
clocks = { clk_i = 10.0 }
no_shift_register = true
chains = [{ label = "din_meta", signals = ["s_din_meta"], registers = 2 }]
constraints = ["src/lm_util_ccd_resync.vhd"]
test_corrupt = { report = "netlist" }
expect_error = "LM_ERROR: no synthesized design is open"

[[cases]]
name = "neg_report_ignored_empty"
entity = "lm_util_ccd_resync"
category = "negative"
description = "Constraint checks with an empty ignored-exceptions report."
tags = ["negative"]
tools = ["vivado"]
generics = { g_meta_levels = 2 }
ports = [
  "clk_i : in std_logic",
  "ccd_din_i : in std_logic",
  "ccd_din_o : out std_logic",
]
clocks = { clk_i = 10.0 }
constraints = ["src/lm_util_ccd_resync.vhd"]
test_corrupt = { report = "exceptions_ignored" }
expect_error = "LM_ERROR: report_exceptions -ignored returned an empty report"
