# ---------------------------------------------------------------------------
# CDC synchronizer cases. Each chains entry names the RTL signals of one
# synchronizer chain and the number of register bits expected for them.
# Structural checks (see README.md):
#   Vivado : chain:<label>:count, chain:<label>:cell_type (FD*),
#            chain:<label>:async_reg (ASYNC_REG = TRUE), no_shift_register
#            (no SRL* cell in the design)
#   Quartus: chain:<label>:count and chain:<label>:synchronizer (registers
#            listed by report_metastability, identified as User Specified),
#            no_shift_register (no SHIFT_TAPS in Analysis & Synthesis)
# clocks gives the Quartus SDC clocks; several clocks are declared
# asynchronous to each other for the synchronizer checks.
# constraints lists the published constraint examples to load ("file.vhd" for
# a module header, "file.md#name" for a marked guide block). They are applied
# on a timing netlist that defines only the case clocks, without clock groups
# unless constraint_clock_groups = true. Checks: constraint:<source>:<n>:objects
# (no empty collection), constraint:<source>:<n>:applied, constraints:listed
# (every exception reported by report_exceptions), constraints:not_ignored,
# constraints:valid (Quartus) and constraints:bus_skew_reported (Vivado, when
# an example uses set_bus_skew).
# ---------------------------------------------------------------------------

[[cases]]
name = "ccd_resync_2ff"
entity = "lm_util_ccd_resync"
category = "cdc"
description = "Two-stage single-bit synchronizer."
tags = ["cdc", "ff-chain", "no-srl"]
generics = { g_meta_levels = 2 }
ports = [
  "clk_i : in std_logic",
  "ccd_din_i : in std_logic",
  "ccd_din_o : out std_logic",
]
clocks = { clk_i = 10.0 }
no_shift_register = true
chains = [{ label = "din_meta", signals = ["s_din_meta"], registers = 2 }]
constraints = ["src/lm_util_ccd_resync.vhd"]

[[cases]]
name = "ccd_resync_4ff"
entity = "lm_util_ccd_resync"
category = "cdc"
description = "Four-stage synchronizer, long enough for shift-register packing without the attributes."
tags = ["cdc", "ff-chain", "no-srl"]
generics = { g_meta_levels = 4 }
ports = [
  "clk_i : in std_logic",
  "ccd_din_i : in std_logic",
  "ccd_din_o : out std_logic",
]
clocks = { clk_i = 10.0 }
no_shift_register = true
chains = [{ label = "din_meta", signals = ["s_din_meta"], registers = 4 }]
constraints = ["src/lm_util_ccd_resync.vhd"]

[[cases]]
name = "ccd_sync_bus_8"
