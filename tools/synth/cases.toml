[[cases]]
name = "async_reset_4ff"
entity = "lm_util_async_reset"
category = "reset"
description = "Four-stage reset synchronizer, long enough for shift-register packing without the attributes."
tags = ["cdc", "reset", "ff-chain", "no-srl"]
generics = { g_delay_len = 4, g_rst_lvl = "'0'" }
ports = [
