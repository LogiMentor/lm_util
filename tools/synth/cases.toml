[sources]
library = "lm_util_lib"
standard = "2008"
files = [
  "src/lm_util_pkg.vhd",
  "src/*.vhd",
]

[[cases]]
name = "delay_shift_reg_32x8"
entity = "lm_util_delay"
category = "storage"
description = "Generic fixed delay inferred from a VHDL shift-register array."
tags = ["storage", "shift-register", "inference"]
generics = { g_delay = 32, g_data_w = 8 }
ports = [
  "clk_i : in std_logic",
  "ce_i : in std_logic",
  "din_i : in std_logic_vector(7 downto 0)",
  "dout_o : out std_logic_vector(7 downto 0)",
]
expect_vivado_regex = ["(?i)shift register|\\bSRL\\b|LUT as Shift Register"]
expect_quartus_regex = ["(?i)shift register|registers|ALM"]
expect_diamond_regex = ["(?i)shift register|distributed ram|slice"]

[[cases]]
name = "delay_srl_31x8_depth32"
entity = "lm_util_delay_srl"
category = "storage"
description = "SRL-style delay below the 32-deep boundary."
tags = ["storage", "srl", "xilinx", "inference"]
generics = { g_delay = 31, g_data_w = 8, g_srl_depth = 32 }
ports = [
  "clk_i : in std_logic",
  "ce_i : in std_logic",
  "din_i : in std_logic_vector(7 downto 0)",
  "dout_o : out std_logic_vector(7 downto 0)",
]
expect_vivado_regex = ["(?i)\\bSRL\\b|LUT as Shift Register|Shift Register"]
expect_quartus_regex = ["(?i)shift register|registers|ALM"]
expect_diamond_regex = ["(?i)shift register|distributed ram|slice"]

[[cases]]
name = "delay_srl_32x8_depth32_boundary"
entity = "lm_util_delay_srl"
category = "storage"
description = "Boundary case where delay equals SRL depth; useful to catch address/index issues."
tags = ["storage", "srl", "boundary", "xilinx", "inference"]
generics = { g_delay = 32, g_data_w = 8, g_srl_depth = 32 }
ports = [
  "clk_i : in std_logic",
  "ce_i : in std_logic",
  "din_i : in std_logic_vector(7 downto 0)",
  "dout_o : out std_logic_vector(7 downto 0)",
]
expect_vivado_regex = ["(?i)\\bSRL\\b|LUT as Shift Register|Shift Register"]
expect_quartus_regex = ["(?i)shift register|registers|ALM"]
expect_diamond_regex = ["(?i)shift register|distributed ram|slice"]

[[cases]]
name = "delay_srl_33x8_depth32"
