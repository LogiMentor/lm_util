  "in_clk_i : in std_logic",
  "in_rst_n_i : in std_logic",
  "in_data_i : in std_logic_vector(7 downto 0)",
  "out_rdy_o : out std_logic",
  "out_clk_i : in std_logic",
  "out_req_i : in std_logic",
  "out_data_o : out std_logic_vector(7 downto 0)",
]
clocks = { in_clk_i = 10.0, out_clk_i = 7.0 }
no_shift_register = true
chains = [{ label = "din_meta", signals = ["s_din_meta"], registers = 4 }]
constraints = ["src/lm_util_ccd_resync.vhd", "src/lm_util_ccd_sync_bus.vhd"]

[[cases]]
name = "ccd_sync_pulse_3"
entity = "lm_util_ccd_sync_pulse"
category = "cdc"
description = "Pulse transfer with level and acknowledge synchronizers."
