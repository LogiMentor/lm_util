#
# Generics for the "ghdl --synth" step of tools/check_vhdl_std.py: one table
# per entity in src/, with representative values. Every entity in src/ must
# have a table (an empty one keeps the defaults) and every table must name an
# entity in src/. Values are passed as -g<name>=<value>.

[lm_util_async_reset]
g_delay_len = "2"
g_rst_lvl = "'0'"

[lm_util_barrel_shifter]
g_data_w = "16"

[lm_util_bitsum]
g_din_w = "16"
g_nof_first_stage_chunk = "3"

[lm_util_ccd_resync]
g_meta_levels = "2"

[lm_util_ccd_switch]
g_priority_lo = "false"
g_or_high = "true"
g_and_low = "false"

[lm_util_ccd_sync_bus]
g_bus_width = "8"
g_meta_levels = "2"

[lm_util_ccd_sync_pulse]
g_delay_len = "3"

[lm_util_clock_gen]
g_clock_div = "10"
g_clock_phase = "0"
g_pos_duty_cycle = "5"

[lm_util_clock_measure]
